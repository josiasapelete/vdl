# Publication d'une version : construit l'installeur Windows et les APK Android,
# puis crée une « Release » GitHub avec les fichiers. Le site les propose ensuite automatiquement.
#
# Déclenchement :  git tag v0.1.0 && git push origin v0.1.0
# (le numéro doit correspondre à __version__ dans vdl/__init__.py)
#
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) pour signer l'APK :
#   ANDROID_KEYSTORE_BASE64   contenu de packaging/android/vdl-release.jks encodé en base64
#   ANDROID_KEYSTORE_PASSWORD mot de passe (packaging/android/keystore.properties)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Dépôt des mises à jour
        shell: pwsh
        run: (Get-Content vdl/__init__.py) -replace 'UPDATE_REPO = ""', 'UPDATE_REPO = "${{ github.repository }}"' | Set-Content -Encoding utf8 vdl/__init__.py
      - name: Construction
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/VDL-Setup-*.exe
            dist/VDL-Portable-*.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Le SDK Android est préinstallé sur les machines Linux de GitHub (ANDROID_HOME)
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vdl-release.jks"
            echo "VDL_KEYSTORE=$RUNNER_TEMP/vdl-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de clé ANDROID_KEYSTORE_BASE64 : APK signé avec une clé de test (les mises à jour ne s'installeront pas par-dessus)."
          fi
      - name: Construction
        working-directory: android
        env:
          VDL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VDL_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VDL_KEY_ALIAS: vdl
          VDL_UPDATE_REPO: ${{ github.repository }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION=$(grep -oP '__version__ = "\K[^"]+' ../vdl/__init__.py)
          mkdir -p ../dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$f" "../dist/VDL-$VERSION-android-$abi.apk"
          done
          ls -la ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Sommes de contrôle
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Notes de version (CHANGELOG.md)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' src/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Version $VERSION" > notes.md; fi
          {
            echo ""
            echo "---"
            echo "**Télécharger :** https://vdl.jakdev.space"
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          body_path: notes.md
